        <style>
            /* always use light text, since the background is black */
            :root {
                color-scheme: dark;

                --grid: #f6f7f512;

            footer nav a { color: var(--fg); }

            #root { position: relative; z-index: 1; min-height: 100svh; }
            /* header ("about iizerz" link) always 15% from the top; social icons always 15% from the bottom */
            .top-block,
            .below-video {
                position: fixed;
                left: 50%;
                transform: translateX(-50%);
                width: min(520px, 100%);
                padding: 0 max(1rem, env(safe-area-inset-left));
            }
            .top-block { top: 15svh; }
            .below-video { bottom: 15svh; }
            /* tighter gap so the social icons fit on the first screen */
            #bg-video {
                position: fixed;
                inset: 0;
                z-index: 0;
                background: #000;
                pointer-events: none;
                overflow: hidden;
            }
            /* video band: 25% black margin on every side, aspect ratio kept, centred */
            #bg-video .band {
                position: absolute;
                top: 25vh;
                bottom: 25vh;
                left: 25vw;
                right: 25vw;
                display: grid;
                place-items: center;
            }
            #bg-video video {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
            /* centre everything: header and social icons */
            .top-block { justify-content: center; text-align: center; width: max-content; max-width: none; }
            /* "iizerz": capital letters as tall as the photo (Helvetica caps are ~0.717em), scales with --h */
            .top-block .name { font-size: calc(var(--h) / .717); line-height: var(--h); display: inline-flex; align-items: center; gap: .2em; }
            /* arrow shows the text is a link; sized relative to the text */
            .top-block .name-arrow { width: .45em; height: .45em; flex: none; }
            .below-video footer { justify-content: center; }
            .below-video footer nav ul { margin-right: 0; justify-content: center; }
            /* opening screen: covers the page until the visitor clicks */
            #intro {
                position: fixed;
                inset: 0;
                z-index: 100;
                display: grid;
                place-items: center;
                width: 100%;
                border: 0;
                padding: 0;
                background: #000;
                color: var(--fg);
                font: inherit;
                cursor: pointer;
                transition: opacity .8s ease, visibility .8s;
            }
            #intro span {
                font-size: 13px;
                letter-spacing: .3em;
                text-transform: uppercase;
                animation: intro-pulse 2.4s ease-in-out infinite;
            }
            #intro:hover span,
            #intro:focus-visible span { animation-play-state: paused; opacity: 1; }
            #intro:focus-visible { outline: none; }
            #intro.is-gone { opacity: 0; visibility: hidden; pointer-events: none; }
            @keyframes intro-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
            @media (prefers-reduced-motion: reduce) { #intro span { animation: none; } }

        <script>
            (function () {
                // links with data-hover-sound play it on hover; on click they play data-click-sound (or the default)
                var defaultClickSound = 'assets/genshin%20ui%20sounds/click%20bubble.mp3';
                // load every sound once up front so it plays instantly, instead of fetching it on each hover
                var sounds = {};
                var get = function (src) {
                    if (!sounds[src]) { sounds[src] = new Audio(src); sounds[src].preload = 'auto'; }
                    return sounds[src];
                };
                var play = function (src) {
                    var a = get(src);
                    a.currentTime = 0;
                    a.play().catch(function () {}); // browsers block sound until the visitor has clicked/tapped the page once
                    return a;
                };
                var hovering = null;
                document.querySelectorAll('a[data-hover-sound]').forEach(function (link) {
                    get(link.dataset.hoverSound);
                    get(link.dataset.clickSound || defaultClickSound);
                    link.addEventListener('mouseenter', function () {
                        // only one hover sound at a time, so quickly sweeping across the icons doesn't pile them up
                        if (hovering && hovering.src !== get(link.dataset.hoverSound).src) hovering.pause();
                        hovering = play(link.dataset.hoverSound);
                    });
                    link.addEventListener('click', function (e) {
                        var a = play(link.dataset.clickSound || defaultClickSound);
                        // same-tab links would cut the sound off, so let it play (up to 2s) before leaving
                        if (link.target !== '_blank' && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
                            e.preventDefault();
                            var done = false;
                            var go = function () { if (!done) { done = true; window.location.href = link.href; } };
                            var clip = link.dataset.clickVideo && document.querySelector(link.dataset.clickVideo);
                            if (clip) {
                                // swap the background video for this link's clip (normal speed) for the full 2s
                                var bg = document.querySelector('#bg-video video:not([hidden])');
                                if (bg && bg !== clip) { bg.pause(); bg.hidden = true; }
                                clip.hidden = false;
                                clip.currentTime = 0;
                                clip.play().catch(function () {});
                            } else {
                                a.addEventListener('ended', go);
                                a.addEventListener('error', go);
                            }
                            setTimeout(go, 2000);
                        }
                    });
                });
                // coming back with the Back button can restore the page mid-swap, so put the normal video back
                window.addEventListener('pageshow', function (e) {
                    if (!e.persisted) return;
                    document.querySelectorAll('#bg-video video').forEach(function (vid, i) {
                        vid.hidden = i !== 0;
                        if (i === 0) { vid.play().catch(function () {}); } else { vid.pause(); }
                    });
                });
            })();
        </script>
        <button id="intro" type="button"><span>click to start</span></button>
        <script>
            (function () {
                // opening screen: shown once per visit, so coming back from the about page skips it
                var intro = document.getElementById('intro');
                var root = document.getElementById('root');
                var v = document.querySelector('#bg-video video');
                var seen = false;
                try { seen = sessionStorage.getItem('introSeen') === '1'; } catch (e) {}
                if (seen) { intro.remove(); return; }

                v.pause();
                root.inert = true;
                intro.focus();
                intro.addEventListener('click', function () {
                    try { sessionStorage.setItem('introSeen', '1'); } catch (e) {}
                    // this click also unlocks sound, so the hover sounds work straight away
                    new Audio('assets/genshin%20ui%20sounds/click%20bubble.mp3').play().catch(function () {});
                    v.currentTime = 0;
                    v.play().catch(function () {});
                    root.inert = false;
                    intro.classList.add('is-gone');
                    setTimeout(function () { intro.remove(); }, 900);
                }, { once: true });
            })();
        </script>
